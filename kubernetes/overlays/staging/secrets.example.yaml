# ── Staging Secrets ──────────────────────────────────────
# Create with:
#   kubectl create secret generic horizonview-secret \
#     --namespace horizonview-staging \
#     --from-literal=JWT_SECRET='<openssl rand -base64 48>' \
#     --from-literal=WEATHERSTACK_API_KEY='' \
#     --from-literal=AVIATIONSTACK_API_KEY='' \
#     --from-literal=NUMVERIFY_API_KEY='' \
#     --from-literal=MAILBOXLAYER_API_KEY='' \
#     --from-literal=IPSTACK_API_KEY='' \
#     --from-literal=FIXER_API_KEY=''
#
# ⚠  Example only — NOT applied by kustomization.yaml. Create the real Secret with the
#    command above, or with SealedSecrets / External Secrets Operator. Never commit real secrets.
apiVersion: v1
kind: Secret
metadata:
  name: horizonview-secret
type: Opaque
stringData:
  JWT_SECRET: "CHANGE_ME_STAGING_SECRET_AT_LEAST_32_CHARS"
  WEATHERSTACK_API_KEY: ""
  AVIATIONSTACK_API_KEY: ""
  NUMVERIFY_API_KEY: ""
  MAILBOXLAYER_API_KEY: ""
  IPSTACK_API_KEY: ""
  FIXER_API_KEY: ""
