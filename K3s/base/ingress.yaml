apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: horizonview
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  rules:
    - host: horizonview.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: horizonview
                port:
                  number: 80
