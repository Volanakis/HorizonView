# ── kube-prometheus-stack Helm values ────────────────────
# helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
# helm upgrade -i monitoring prometheus-community/kube-prometheus-stack \
#   -n monitoring --create-namespace -f values.yaml

global:
  evaluationInterval: 30s
  scrapeInterval: 30s

alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["namespace", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: "null"
      routes:
        - receiver: "null"
          matchers:
            - severity =~ "warning|info"
    receivers:
      - name: "null"

grafana:
  enabled: true
  adminPassword: ""  # auto-generated if empty; set via --set grafana.adminPassword=
  defaultDashboardsEnabled: true
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: horizonview
          orgId: 1
          folder: HorizonView
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/horizonview
  dashboards:
    horizonview:
      horizonview-app:
        url: https://raw.githubusercontent.com/Volanakis/HorizonView/main/helm/grafana-dashboards/horizonview.json
        token: ""
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.monitoring:3100
      jsonData:
        maxLines: 1000
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - grafana.example.com
    tls:
      - hosts:
          - grafana.example.com
        secretName: grafana-tls
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    size: 10Gi
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      folder: horizonview
      searchNamespace: ALL

prometheus:
  prometheusSpec:
    replicas: 1
    retention: 7d
    retentionSize: 10GB
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    enableRemoteWriteReceiver: false
    walCompression: true
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

kube-state-metrics:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 128Mi

prometheus-node-exporter:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

prometheus-blackbox-exporter:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 64Mi
